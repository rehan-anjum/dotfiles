# reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# terminal
set-option -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# arch
if-shell '[ "$(uname -sm)" = "Darwin arm64" ]' 'set-option -g default-command "arch -arch arm64 /bin/zsh"'

# prefix
set -g prefix C-s

# enable mouse
set -g mouse on

# act like vim
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

bind '"' split-window -c "#{pane_current_path}"  # Split horizontally
bind '%' split-window -h -c "#{pane_current_path}"  # Split vertically

set-option -g status-position top

# name windows after their directory instead of the running command
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# copy / paste (system clipboard)
# prefix + [ enters copy mode, prefix + ] pastes (from the macOS clipboard on a Mac)
set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
if-shell 'command -v pbcopy' {
	bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
	bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
	bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
	bind-key ] run-shell "pbpaste | tmux load-buffer - && tmux paste-buffer"
} {
	# no pbcopy (Linux): copies reach the system clipboard via OSC 52 (set-clipboard on)
	bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
	bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
	bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
}

# list of plugins
set -g @plugin 'tmux-plugins/tpm'

# Resurrect
set -g @plugin 'tmux-plugins/tmux-resurrect'
bind S run-shell ~/.tmux/plugins/tmux-resurrect/scripts/save.sh
bind R run-shell ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh

# Continuum
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Tmux Vim Navigator
set -g @plugin 'christoomey/vim-tmux-navigator'

# Catpuccin
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "rounded"
set -g status-left  ""
set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_session}"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W"

# ── Claude Code ───────────────────────────────────────────────────────────────
# snappy Esc (avoids the vim/Claude "escape lag" without breaking meta keys)
set -s escape-time 10

# let Claude Code / vim know when the pane gains or loses focus
set -g focus-events on

# Claude Code prints a lot; keep plenty of scrollback
set -g history-limit 100000

# allow apps to pass escape sequences straight through tmux
# (needed for OSC 52 clipboard, image protocols, progress/title sequences)
set -g allow-passthrough on
set -g set-clipboard on

# Shift+Enter / Option+Enter for multi-line prompts in Claude Code
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys:RGB:hyperlinks:clipboard:usstyle'

# highlight the window when Claude rings the bell (e.g. finished / needs input)
set -g monitor-bell on
set -g visual-bell off
set -g bell-action other

# ── slightly dim inactive panes ───────────────────────────────────────────────
# catppuccin macchiato: base #24273a (active) vs mantle #1e2030 (inactive)
set -g window-style 'bg=#1e2030'
set -g window-active-style 'bg=#24273a'

# initialize tmux plugin manager
run '~/.tmux/plugins/tpm/tpm'



